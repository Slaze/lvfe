[build]
  publish = "web"
  functions = "netlify/functions"

# Optional alternate host (primary public save is Iconia PHP:
# https://iconiaglobal.com/lvfe-save — see hosting/lvfe-save/).
# Requires: npx netlify login && npx netlify deploy --prod
# Set SAVE_SECRET, LVFE_ALLOW_DEV_AUTH=0, GOOGLE_WEB_CLIENT_ID in the site UI.
# Client override: localStorage lvfe.saveApiBase = https://<site>

[[redirects]]
  from = "/v1/save/*"
  to = "/.netlify/functions/save?key=:splat"
  status = 200
  force = true

[[headers]]
  for = "/v1/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

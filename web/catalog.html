<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lvfe — Catalog</title>
  <link rel="stylesheet" href="css/lvfe.css" />
  <link rel="stylesheet" href="css/switch.css" />
</head>
<body>
  <div class="nav">
    <h1>Lvfe · Catalog</h1>
    <span class="bal">NairaCoin <strong id="ncBal">0 NairaCoin</strong></span>
    <span class="sub" id="ncNote">demo faucet</span>
    <div class="links">
      <a href="index.html">Map</a>
      <a href="rules.html">How to play</a>
      <a href="assets.html">My assets</a>
    </div>
  </div>
  <div class="wrap">
    <p class="sub">Same place file as a map pin. Toggle which sections you need. Banks and ATMs cannot be owned.</p>
    <div class="sec-toggles sw-stack" id="secToggles">
      <label class="sw-row">Place
        <input type="checkbox" class="sw" role="switch" data-sec="place" aria-checked="true" checked /></label>
      <label class="sw-row">Mission
        <input type="checkbox" class="sw" role="switch" data-sec="mission" aria-checked="true" checked /></label>
      <label class="sw-row">Land
        <input type="checkbox" class="sw" role="switch" data-sec="land" aria-checked="true" checked /></label>
      <label class="sw-row">Money
        <input type="checkbox" class="sw" role="switch" data-sec="money" aria-checked="true" checked /></label>
      <label class="sw-row">Wallet
        <input type="checkbox" class="sw" role="switch" data-sec="wallet" aria-checked="true" checked /></label>
    </div>
    <div class="filters">
      <label>Search<input type="search" id="qSearch" placeholder="Name, type, neighbourhood" /></label>
      <label>Show<select id="qView">
        <option value="mine">My places</option>
        <option value="all">All places</option>
      </select></label>
      <label>Type<select id="qType"></select></label>
      <label>Quality<select id="qQuality">
        <option value="">All</option>
        <option value="A">A — photo</option>
        <option value="B">B — named</option>
        <option value="C">C — needs a name</option>
        <option value="D">D — unknown building</option>
      </select></label>
      <label>Neighbourhood<select id="qTerr"></select></label>
      <label>Owned<select id="qClaimed">
        <option value="">All</option>
        <option value="no">Not owned</option>
        <option value="yes">Owned</option>
      </select></label>
    </div>
    <p class="meta" id="meta">Loading catalog…</p>
    <div class="cat-list" id="catList"></div>
    <div class="pager">
      <button type="button" class="ghost" id="prev">Prev</button>
      <span id="pageLabel" class="sub">Page 1</span>
      <button type="button" class="ghost" id="next">Next</button>
    </div>
  </div>
  <div id="catFile" hidden>
    <div class="sheet-bar">
      <button type="button" class="sheet-close" id="catFileClose" aria-label="Close">×</button>
    </div>
    <div id="catCard"></div>
  </div>
  <div id="toast" hidden></div>
  <script src="js/lvfe-assets.js"></script>
  <script src="js/claim-rules.js"></script>
  <script src="js/conquest.js"></script>
  <script src="js/dossier.js"></script>
  <script src="js/track-guide.js"></script>
  <script src="nairacoin/protocol.js"></script>
  <script src="nairacoin/iou-ledger.js"></script>
  <script src="nairacoin/rpc-stub.js"></script>
  <script src="js/nairacoin.js"></script>
  <script src="js/place-ledger.js"></script>
  <script src="js/photo-store.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>

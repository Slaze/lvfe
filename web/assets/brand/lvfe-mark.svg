<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lvfe">
  <defs>
    <radialGradient id="disc" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#2a2f38"/>
      <stop offset="55%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a18"/>
    </linearGradient>
    <linearGradient id="pinGreen" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#4cd964"/>
      <stop offset="55%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#248a3d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- transparent canvas; seal centered -->
  <circle cx="256" cy="256" r="236" fill="url(#goldRing)"/>
  <circle cx="256" cy="256" r="214" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="rgba(255,236,190,0.18)" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <!-- map pin -->
    <path fill="url(#pinGreen)" d="M256 92c-62 0-112 50-112 112 0 78 92 176 104 190a12 12 0 0 0 16 0c12-14 104-112 104-190 0-62-50-112-112-112z"/>
    <circle cx="256" cy="198" r="46" fill="#1a1d23"/>
    <!-- geometric L claim mark -->
    <path fill="url(#goldRing)" d="M236 170h48v18H254v48h-18z"/>
  </g>
</svg>
